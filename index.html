<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In the Search</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud,
      .info-panel,
      #action-menu {
        position: absolute;
        padding: 8px 12px;
        background: rgba(9, 13, 14, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 4px;
        line-height: 1.5;
        font-size: 13px;
        box-sizing: border-box;
      }
      #hud {
        top: 8px;
        left: 8px;
        pointer-events: none;
        white-space: pre-line;
      }
      .info-panel {
        bottom: 8px;
        min-width: 220px;
        max-width: min(330px, calc(50vw - 16px));
        max-height: 42vh;
        overflow: auto;
        pointer-events: auto;
      }
      #unit-panel {
        left: 8px;
      }
      #enemy-panel {
        right: 8px;
      }
      .panel-title {
        margin-bottom: 6px;
        color: #9fb4bd;
        font-weight: 700;
      }
      .panel-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2px;
        width: 100%;
        margin: 4px 0;
        padding: 6px 8px;
        color: #eef5f3;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        text-align: left;
        font: inherit;
      }
      button.panel-row {
        cursor: pointer;
      }
      .panel-row.selected {
        border-color: #f4d35e;
        box-shadow: 0 0 0 1px rgba(244, 211, 94, 0.55);
      }
      .panel-row.exhausted {
        opacity: 0.48;
      }
      .row-main {
        font-weight: 700;
      }
      .row-stat,
      .panel-empty {
        color: #b7c5c9;
      }
      #action-menu {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 138px;
        pointer-events: auto;
      }
      #action-menu[hidden] {
        display: none;
      }
      #action-menu button {
        padding: 6px 8px;
        color: #f2f7f5;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 4px;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #action-menu button:disabled {
        color: #829096;
        cursor: default;
        opacity: 0.62;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">In the Search MVP</div>
    <div id="unit-panel" class="info-panel"></div>
    <div id="enemy-panel" class="info-panel"></div>
    <div id="action-menu" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
