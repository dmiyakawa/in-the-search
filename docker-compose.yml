services:
  dev:
    image: node:20-bookworm-slim
    working_dir: /app
    profiles:
      - dev
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

  web:
    build:
      context: .
      target: web
    profiles:
      - web
    ports:
      - "8080:80"

volumes:
  node_modules:
